<html lang="it">
<head>

  <link rel="preload" href="assets/fonts/RobotoSerif-BlackCondensed.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="character.css">
  <script src="data/books.js" defer></script>
  <script src="character.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#scaffali">Vai ai libri</a>
  <div class="page" id="inizio">
    <header class="masthead">
      <div class="masthead-meta"><p>Diario di lettura</p><p><span id="total-books">—</span> libri, per ora.</p></div>
      <h1><span>Le letture</span> <span>di <span class="title-yuri">Yuri<svg viewBox="0 0 300 18" preserveAspectRatio="none" aria-hidden="true"><path d="M5 12 Q145 1 294 7 M12 14 Q181 5 289 10"/></svg></span></span></h1>
    </header>

    <div class="stage" id="stage" aria-hidden="true">
      <svg class="stage-floor" viewBox="0 0 1200 8" preserveAspectRatio="none"><path d="M1 5 Q205 3 415 5 T810 4 L1199 5"/></svg>
      <svg class="scenery book-stack" viewBox="0 0 90 46">
        <path d="M6 39 L64 40 L64 32 L8 31 Z M12 30 L67 30 L68 23 L13 23 Z M8 22 L59 23 L60 15 L7 14 Z M16 14 L61 13 L62 6 L17 7 Z"/>

      </svg>
      <svg class="scenery bookcase" viewBox="0 0 128 120">
        <path d="M9 117 L8 7 L14 6 L15 114 M108 116 L109 4 L115 4 L114 117 M14 48 L109 49 L109 54 L14 53 M15 101 L109 103 L109 109 L15 107 M9 117 L115 117"/>
        <path d="M19 46 L18 15 L24 14 L27 47 Z M29 47 L28 20 L34 19 L36 47 Z M41 47 L33 16 L39 14 L48 46 Z M51 47 L51 40 L74 40 L74 47 Z M77 47 L76 11 L83 11 L84 47 Z M87 46 L87 18 L94 19 L94 47 Z M97 47 L96 9 L103 8 L104 47 Z"/>
        <path d="M21 102 L19 63 L25 62 L29 102 Z M32 102 L30 68 L37 67 L40 102 Z M44 102 L38 67 L44 65 L51 101 Z M58 101 L46 81 L52 78 L66 100 Z M76 101 L84 65 L91 67 L83 102 Z M89 102 L98 70 L104 71 L96 103 Z"/>
        <path d="M21 22 L24 22 M31 25 L34 25 M80 18 L82 18 M90 24 L93 24 M99 16 L102 16 M22 70 L25 70 M33 77 L37 77 M84 76 L87 77 M98 81 L101 82 M2 118 L0 110 M4 118 L5 106 M120 118 L124 110"/>
      </svg>
      <div class="actor" id="actor"><div class="actor-facing" id="actor-facing"><div class="character" id="character"></div></div></div>
    </div>

    <nav class="mobile-nav" aria-label="Vai a uno scaffale">
      <button type="button" data-destination="in-lettura" aria-pressed="true" aria-controls="scaffale-in-lettura">Sto leggendo</button>
      <button type="button" data-destination="letto" aria-pressed="false" aria-controls="scaffale-letto">Letti</button>
      <button type="button" data-destination="da-leggere" aria-pressed="false" aria-controls="scaffale-da-leggere">Da leggere</button>
    </nav>

    <main class="catalog" id="scaffali">
      <section class="shelf" id="scaffale-in-lettura" aria-labelledby="heading-in-lettura" data-shelf="in-lettura">
        <h2 id="heading-in-lettura"><button class="shelf-control" type="button" data-destination="in-lettura" aria-pressed="true"><span class="shelf-label label-reading">Sto leggendo</span><span class="shelf-count" data-count="in-lettura">—</span></button></h2>
        <ul class="book-list" id="books-in-lettura"></ul>
        <div class="shelf-bottom"><p class="visible-count" data-visible-count="in-lettura" aria-live="polite"></p></div>
      </section>
      <section class="shelf" id="scaffale-letto" aria-labelledby="heading-letto" data-shelf="letto">
        <h2 id="heading-letto"><button class="shelf-control" type="button" data-destination="letto" aria-pressed="false"><span class="shelf-label label-read">Letti</span><span class="shelf-count" data-count="letto">—</span></button></h2>
        <ul class="book-list" id="books-letto"></ul>
        <div class="shelf-bottom"><p class="visible-count" data-visible-count="letto" aria-live="polite"></p><button class="show-more" type="button" data-more="letto" aria-controls="books-letto" hidden>Mostra altri <span aria-hidden="true">→</span></button></div>
      </section>
      <section class="shelf" id="scaffale-da-leggere" aria-labelledby="heading-da-leggere" data-shelf="da-leggere">
        <h2 id="heading-da-leggere"><button class="shelf-control" type="button" data-destination="da-leggere" aria-pressed="false"><span class="shelf-label">Da leggere</span><span class="shelf-count" data-count="da-leggere">—</span></button></h2>
        <ul class="book-list" id="books-da-leggere"></ul>
        <div class="shelf-bottom"><p class="visible-count" data-visible-count="da-leggere" aria-live="polite"></p><button class="show-more" type="button" data-more="da-leggere" aria-controls="books-da-leggere" hidden>Mostra altri <span aria-hidden="true">→</span></button></div>
      </section>
      <noscript><p>Attiva JavaScript per consultare il catalogo e aprire i dettagli dei libri.</p></noscript>
    </main>
    <p class="sr-only" id="navigation-status" role="status"></p>
    <footer class="colophon"><span>Le letture di Yuri</span><a href="#inizio">Torna alla testata <span aria-hidden="true">↑</span></a></footer>
  </div>

  <dialog id="book-dialog" aria-labelledby="detail-title" aria-describedby="detail-author">
    <div class="dialog-top"><span>Dal catalogo</span><button id="close-dialog" type="button" autofocus>Chiudi <span aria-hidden="true">×</span></button></div>
    <h2 id="detail-title"></h2>
    <p id="detail-author"></p>
    <dl id="detail-metadata"></dl>
    <div id="detail-notes" hidden><h3>Note personali</h3><p></p></div>
  </dialog>
</body>
</html>
